<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeja · Lajas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="portada">
    <p class="saludo">Zona privada</p>
    <h1>Bandeja de <em>entradas</em></h1>
    <p>Solicitudes de perfiles y confirmaciones de eventos.</p>
  </header>

  <nav class="tabs-nav">
    <div class="tabs-contenedor contenedor">
      <button class="tab activo" data-tab="solicitudes">Solicitudes</button>
      <button class="tab" data-tab="participaciones">Participaciones en Eventos</button>
    </div>
  </nav>

  <main class="contenedor">
    <a class="nav-volver" href="index.html">← Volver a las Lajas</a>

    <!-- Vista: Solicitudes de perfiles -->
    <section id="sec-solicitudes" class="seccion">
      <div class="filtros" id="filtros"></div>
      <div id="solicitudes"></div>
    </section>

    <!-- Vista: Participaciones en eventos -->
    <section id="sec-participaciones" class="seccion seccion-oculta">
      <div class="filtros" id="filtros-eventos"></div>
      <div id="participaciones"></div>
    </section>
  </main>

  <footer>Hecho con cariño (y un poco de código)</footer>

  <script src="datos.js"></script>
  <script src="bandeja.js"></script>
</body>
</html>
